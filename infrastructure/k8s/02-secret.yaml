apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: codefyve
  labels:
    app.kubernetes.io/name: codefyve
type: Opaque
stringData:
  APP_KEY: "base64:REPLACE_WITH_GENERATED_KEY"

  DB_HOST: "REPLACE_WITH_DB_HOST"
  DB_DATABASE: "REPLACE_WITH_DB_NAME"
  DB_USERNAME: "REPLACE_WITH_DB_USER"
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"

  REDIS_HOST: "REPLACE_WITH_REDIS_HOST"
  REDIS_PASSWORD: ""

  SANCTUM_STATEFUL_DOMAINS: "REPLACE_WITH_YOUR_DOMAIN"
  FRONTEND_URL: "https://REPLACE_WITH_YOUR_DOMAIN"
  NEXT_PUBLIC_API_URL: "https://REPLACE_WITH_YOUR_DOMAIN"
  API_URL: "http://backend:8000"
