apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: codefyve
  labels:
    app.kubernetes.io/name: codefyve
data:
  APP_NAME: "Project Management Platform"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_TIMEZONE: "UTC"
  # Set to the external domain at deploy time (used by Laravel for URL generation)
  APP_URL: "https://REPLACE_WITH_YOUR_DOMAIN"
  APP_LOCALE: "en"

  LOG_CHANNEL: "stack"
  LOG_LEVEL: "warning"

  DB_CONNECTION: "pgsql"
  DB_PORT: "5432"

  CACHE_STORE: "redis"
  QUEUE_CONNECTION: "redis"
  SESSION_DRIVER: "redis"
  SESSION_LIFETIME: "120"

  REDIS_PORT: "6379"
  REDIS_CLIENT: "predis"
  # Must exceed the worker --timeout flag (90s) to prevent duplicate job processing
  REDIS_QUEUE_RETRY_AFTER: "120"

  BROADCAST_CONNECTION: "log"
  FILESYSTEM_DISK: "local"

  NEXT_PUBLIC_APP_NAME: "Project Management Platform"
  # NEXT_PUBLIC_API_URL is a build-time variable — set it via Docker build args in CI,
  # not as a runtime env var. Browser bundles are compiled at image build time.
