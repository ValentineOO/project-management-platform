name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, staging, main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pmp_test
          POSTGRES_USER: pmp_user
          POSTGRES_PASSWORD: pmp_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmp_user -d pmp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pcntl, bcmath, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Lint (PHP Pint)
        run: ./vendor/bin/pint --test

      - name: Set up .env.testing
        run: |
          cp .env.example .env.testing
          sed -i 's/^APP_KEY=.*//' .env.testing
          php artisan key:generate --env=testing
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=pmp_test/' .env.testing
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=pmp_user/' .env.testing
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=pmp_secret/' .env.testing

      - name: Run migrations
        run: php artisan migrate --env=testing --force

      - name: Run tests
        run: php artisan test --env=testing

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          API_URL: http://localhost:8000
